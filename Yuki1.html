<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女王專屬任務</title>
    <style>
        :root {
            --primary: #6a0dad;
            --glow: #a855f7;
            --gold: #ffd700;
            --dark: #121212;
            --success: #00ff00;
        }

        body { background-color: var(--dark); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }

        .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 400px; }
        h1 { color: var(--gold); font-size: 1.5rem; margin: 5px 0; }
        .sub-text { color: #aaa; font-size: 0.9rem; margin-bottom: 15px; }

        /* 1. 啟動區 */
        #start-box { width: 100%; max-width: 400px; background: rgba(255, 215, 0, 0.1); border: 2px solid var(--gold); border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        .btn-main { background: linear-gradient(45deg, #ff0000, #ff7700); border: none; color: white; padding: 18px; width: 100%; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }

        /* 2. 影片區 */
        #video-section { display: none; width: 100%; max-width: 400px; border: 2px solid var(--primary); border-radius: 15px; overflow: hidden; background: #000; margin-bottom: 20px; }
        video { width: 100%; display: block; }

        /* 3. 輸入答案區 */
        #quiz-box { display: none; width: 100%; max-width: 400px; background: rgba(106, 13, 173, 0.2); border: 1px solid var(--glow); border-radius: 15px; padding: 25px 20px; text-align: center; }
        .input-label { color: var(--gold); font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; display: block; }
        
        .answer-input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid var(--primary); background: #2a2a2a; color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        .answer-input:focus { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
        
        .btn-submit { background: var(--primary); border: 1px solid var(--glow); color: white; padding: 12px; width: 100%; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }

        /* 過關訊息 */
        #success-box { display: none; margin-top: 20px; color: var(--success); font-weight: bold; line-height: 1.6; border: 1px solid var(--success); padding: 15px; border-radius: 10px; background: rgba(0, 255, 0, 0.05); }

        .footer { margin-top: auto; padding-top: 30px; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>

<div class="header">
    <h1><span id="name-label">女王</span> 專屬任務</h1>
    <div class="sub-text" id="status-msg">系統待機中...</div>
</div>

<div id="start-box">
    <h2 style="color:var(--gold); margin-top:0;">女王，要不要餵食啊？</h2>
    <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 20px;">請交付第一顆能量代幣，啟動系統語音指令。</p>
    <button class="btn-main" onclick="initiate()">🔥 即刻補幾，啟動指令</button>
</div>

<audio id="audio-player"></audio>

<div id="video-section">
    <div style="padding:12px; text-align:center; font-size:0.85rem; color:var(--gold);">
        母親節專屬獻禮：這首歌送給最偉大的女性。<br>請留意接下來的歌詞內容。
    </div>
    <video id="mv-video" controls playsinline>
        <source src="Yuki%20girl.MP4" type="video/mp4">
    </video>
</div>

<div id="quiz-box">
    <label class="input-label" for="user-answer">🎤 記憶考驗：請輸入正確的歌詞</label>
    <input type="text" id="user-answer" class="answer-input" placeholder="請在此輸入文字..." autocomplete="off">
    <button class="btn-submit" onclick="checkAnswer()">提交答案</button>

    <div id="success-box">
        🎉 認證成功！女王神記憶！<br>
        第一階段任務已達成，即將進入下一關...
    </div>
</div>

<div class="footer">HAPPY MOTHER'S DAY 2026</div>

<script>
    const correctLyric = "你不懂女生"; 

    const params = new URLSearchParams(window.location.search);
    const user = params.get('name') || 'jayyan';
    const label = (user === 'jayyan') ? 'Jay Yan' : (user === 'yaling' ? '雅玲' : user);
    document.getElementById('name-label').innerText = label;

    const audio = document.getElementById('audio-player');
    audio.src = user + ".mp3";

    const video = document.getElementById('mv-video');

    function initiate() {
        document.getElementById('start-box').style.display = 'none';
        document.getElementById('status-msg').innerText = "系統指令傳輸中...";
        audio.play().catch(() => showMV());
        audio.onended = showMV;
    }

    function showMV() {
        document.getElementById('status-msg').innerText = "請欣賞專屬獻禮";
        document.getElementById('video-section').style.display = 'block';
        document.getElementById('video-section').scrollIntoView({behavior: 'smooth'});
    }

    video.onended = function() {
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('quiz-box').scrollIntoView({behavior: 'smooth'});
    };

    function checkAnswer() {
        const userInput = document.getElementById('user-answer').value.trim();
        const successBox = document.getElementById('success-box');
        
        const cleanUser = userInput.replace(/\s+/g, '');
        const cleanCorrect = correctLyric.replace(/\s+/g, '');

        if (cleanUser === cleanCorrect) {
            successBox.style.display = 'block';
            document.getElementById('user-answer').disabled = true;
            document.querySelector('.btn-submit').disabled = true;
            successBox.scrollIntoView({behavior: 'smooth'});

            // 重點修正：3秒後自動跳轉到 Yuki2.html
            setTimeout(() => {
                window.location.href = "Yuki2.html?name=" + user;
            }, 3000); 

        } else {
            alert("歌詞好像不對喔，再回想一下影片！");
        }
    }
</script>

</body>
</html>
