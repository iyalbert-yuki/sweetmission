<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜蜜任務：第一關遊戲</title>
    <style>
        :root {
            --inyuan-purple: #6a0dad;
            --led-glow: #a855f7;
            --gold: #ffd700;
            --dark: #121212;
            --success-green: #00ff00;
        }

        body { background-color: var(--dark); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }

        .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .level-badge { display: inline-block; background: var(--inyuan-purple); color: white; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; border: 1px solid var(--led-glow); }
        h1 { color: var(--gold); font-size: 1.5rem; margin: 5px 0; }
        .sub-text { color: #aaa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 15px; }

        /* 影片播放區 */
        .video-container { width: 100%; max-width: 400px; border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); background: #000; margin-bottom: 20px; }
        video { width: 100%; display: block; }

        /* 純文字考驗區 (預設隱藏，影片播完跳出) */
        .quiz-container { display: none; width: 100%; max-width: 400px; background: rgba(0, 0, 0, 0.8); border: 2px solid var(--led-glow); border-radius: 15px; padding: 25px; box-sizing: border-box; text-align: center; animation: popIn 0.5s ease; position: relative; z-index: 10; }
        
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 🏃跑馬燈字 (MARQUEE) CSS */
        .scrolling-text-container {
            width: 100%;
            overflow: hidden;
            background: rgba(106, 13, 173, 0.3);
            border-radius: 5px;
            padding: 8px 0;
            margin-bottom: 20px;
            border-top: 1px solid var(--led-glow);
            border-bottom: 1px solid var(--led-glow);
        }

        .scrolling-text {
            white-space: nowrap;
            display: inline-block;
            animation: marquee 10s linear infinite;
            color: var(--gold);
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* 填寫答案區域 */
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-label { color: #fff; font-size: 1rem; margin-bottom: 10px; display: block; }
        
        /* 答案輸入框 */
        .answer-input { 
            width: 100%; 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid #555; 
            color: #fff; 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 1.1rem; 
            text-align: center;
            letter-spacing: 2px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .answer-input:focus { outline: none; border-color: var(--led-glow); box-shadow: 0 0 10px var(--led-glow); background: rgba(255,255,255,0.15); }

        /* 送出按鈕 */
        .btn-submit { width: 100%; background: var(--inyuan-purple); border: none; color: white; padding: 15px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.3s; }
        .btn-submit:hover { filter: brightness(1.2); }
        .btn-submit:disabled { background: #555; cursor: default; box-shadow: none; }

        /* 過關提示區 */
        .success-message { display: none; margin-top: 20px; padding: 15px; background: rgba(0, 255, 0, 0.1); border: 2px solid var(--success-green); border-radius: 10px; color: var(--success-green); animation: fadeIn 0.5s ease-in; }
        .success-message span { color: var(--gold); font-weight: bold; font-size: 1.1rem; }
        .btn-next { margin-top: 15px; padding: 10px 20px; background: #008800; color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

<div class="header">
    <div class="level-badge">LEVEL 1 CHALLENGE</div>
    <h1>🎤 女神大考驗</h1>
    <p class="sub-text">母親節快樂！請欣賞專屬 MV，並用心聆聽歌詞。影片停下後，請在下方輸入正確歌詞以開啟甜蜜任務補幾！</p>
</div>

<div class="video-container">
    <!-- 影片檔案：Yuki girl.MP4 -->
    <video id="mv-player" controls playsinline>
        <source src="Yuki%20girl.MP4" type="video/mp4">
        您的瀏覽器不支援影片播放。
    </video>
</div>

<!-- 【純文字考驗區】：預設隱藏，影片播完跳出 -->
<div class="quiz-container" id="quiz-box">
    
    <!-- 🏃跑馬燈跑字區域 -->
    <div class="scrolling-text-container">
        <!-- 女神，他一定知道跟 秋天追了快30年了 -->
        <div class="scrolling-text">
            董娘女神，影片唱到這裡，接下來的歌詞是什麼？您一定知道跟秋天追了快30年了...
        </div>
    </div>

    <div class="input-group">
        <label class="input-label" for="answer-input">請將<span>影片停下後的下一句歌詞</span>填入下方：</label>
        <input type="text" id="answer-input" class="answer-input" placeholder="請手寫輸入歌詞谜底" autocomplete="off">
    </div>
    
    <button class="btn-submit" id="submit-btn" onclick="checkAnswer()">🔊 送出答案</button>

    <div class="success-message" id="success-box">
        🎉 破關！女神神記憶！🎉<br><br>
        恭喜您成功突破第一關卡！<br>
        請將您的<span>【第一顆軟糖能量】</span>遞交給助手，<br>
        以啟動他的輔助功能！<br><br>
        <!-- 前往下關挑戰按鈕 (保留名字參數) -->
        <button class="btn-next" onclick="goToYuki2()">前往下一挑戰 ➔</button>
    </div>
</div>

<div class="footer" style="margin-top: 30px; font-size: 0.7rem; color: #444;">音圓國際 代理商維護專員 秋天</div>

<script>
    // 顯示名稱 (雖然去選項，抬頭還是保留个性化)
    const params = new URLSearchParams(window.location.search);
    const user = params.get('name') || '董娘';
    
    // 從 index 跳轉過來的 user 參數會在這裡生效

    const mvPlayer = document.getElementById('mv-player');
    const quizBox = document.getElementById('quiz-box');
    const inputField = document.getElementById('answer-input');
    const submitBtn = document.getElementById('submit-btn');
    const successBox = document.getElementById('success-box');

    // *******************************************************
    // 🔥 【謎底設定】：請在此處填入您影片唱完後的「正確歌詞」
    // *******************************************************
    // 為了降低輸入難度，比對時會自動轉小寫並去除前後空白
    const correctAnswer = "您在這裡填入正確歌詞謎底"; 

    // 當影片播放完畢時，自動跳出猜歌詞考驗
    mvPlayer.addEventListener('ended', function() {
        // 暫停影片播放
        mvPlayer.pause(); 
        
        // 顯示純文字填空考驗區
        quizBox.style.display = 'block';
        quizBox.scrollIntoView({ behavior: 'smooth' }); // 自動捲動到考驗區
        inputField.focus(); // 自動將焦點放到輸入框
    });

    // 檢查答案的邏輯
    function checkAnswer() {
        // 取得使用者輸入並進行格式化 (去除前後空白)
        const userAnswer = inputField.value.trim();

        // 鎖定送出按鈕與輸入框
        submitBtn.disabled = true;
        inputField.disabled = true;

        // 如果輸入為空，直接提示並解鎖
        if (!userAnswer) {
            alert("女神，還沒填寫答案喔！");
            submitBtn.disabled = false;
            inputField.disabled = false;
            inputField.focus();
            return;
        }

        // 進行答案比對 (字串完全匹配，不分大小寫)
        // 🔥 比對 correctAnswer 謎底
        if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
            // 答對了！
            successBox.style.display = 'block'; // 顯示過關與餵食提示
            successBox.scrollIntoView({ behavior: 'smooth' });
            submitBtn.style.display = 'none'; // 隱藏送出按鈕
        } else {
            // 答錯了！
            inputField.style.borderColor = "#ff0000"; // 輸入框變紅
            inputField.style.boxShadow = "0 0 10px #ff0000";
            
            setTimeout(() => {
                alert("哎呀！女神差一點點，再想一下影片裡的歌詞謎底！如果您忘了，秋天可以給您提示喔！");
                // 解除鎖定並重置顏色，讓她重猜
                inputField.disabled = false;
                submitBtn.disabled = false;
                inputField.style.borderColor = "#555";
                inputField.style.boxShadow = "none";
                inputField.focus();
            }, 800);
        }
    }

    // 當使用者在輸入框按下 Enter 鍵時，視同點擊送出
    inputField.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            submitBtn.click();
        }
    });

    // 跳轉到下一關的邏輯
    function goToYuki2() {
        window.location.href = `Yuki2.html?name=${user}`; // 跳轉至 Yuki2.html (保留名字參數)
    }
</script>

</body>
</html>
