<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一關：歌詞考驗</title>
    <style>
        :root { --purp: #6a0dad; --gold: #ffd700; --bg: #0f0f0f; }
        body { background: var(--bg); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .frame { width: 100%; max-width: 420px; border: 1px solid var(--purp); border-radius: 25px; padding: 25px; background: #000; text-align: center; }
        .v-box { width: 100%; border: 2px solid var(--purp); border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
        video { width: 100%; display: block; }
        .input-ans { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #555; background: #222; color: #fff; text-align: center; font-size: 1.1rem; margin-bottom: 10px; }
        .btn-sub { background: linear-gradient(45deg, var(--purp), #a855f7); color: #fff; padding: 15px; width: 100%; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
        #q-box { display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>
<div class="frame">
    <h1>第一關：專屬獻唱</h1>
    <div class="v-box">
        <video id="p" controls playsinline poster="Party7000.png"><source src="Yuki%20girl.MP4" type="video/mp4"></video>
    </div>
    <div id="q-box">
        <p style="color:var(--gold);">🎤 影片最後停在哪一句歌詞？</p>
        <input type="text" id="ans" class="input-ans" placeholder="請直接輸入答案">
        <button class="btn-sub" onclick="chk()">提交答案</button>
    </div>
</div>
<script>
    const ps = new URLSearchParams(window.location.search);
    const u = ps.get('name') || 'JAY_YAN';
    const p = document.getElementById('p');
    p.onended = () => { document.getElementById('q-box').style.display='block'; };

    function chk() {
        if(document.getElementById('ans').value.trim() === '你不懂女生') {
            alert("🎉 答對了！\n助手秋天模式已啟動。請餵食【第二顆軟糖】以解鎖時光機！");
            window.location.href = `Yuki2.html?name=${u}`;
        } else {
            alert("哎呀！答案不對喔。請直接打上答案（你不懂女生）！");
        }
    }
</script>
</body>
</html>
