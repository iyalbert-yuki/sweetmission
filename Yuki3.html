<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三關：終極 PK</title>
    <style>
        :root { --purp: #6a0dad; --gold: #ffd700; --bg: #0f0f0f; --win: #33aaff; --lose: #ff3333; }
        body { background: var(--bg); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .frame { width: 100%; max-width: 400px; border: 2px solid var(--purp); border-radius: 30px; padding: 25px; background: #000; text-align: center; }
        .hp-box { width: 100%; height: 20px; background: #333; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .hp-bar { width: 20%; height: 100%; background: red; transition: 0.5s; }
        .timer { font-size: 2rem; color: var(--lose); font-weight: bold; margin-bottom: 10px; }
        .g-b { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .tile { aspect-ratio: 1; background: #222; border: 1px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .t-p { fill: none; stroke: #888; stroke-width: 8; stroke-linecap: round; }
        .matched .t-p { stroke: var(--win); }
        .matched { border-color: var(--win); }
        .btn-pk { background: var(--lose); color: #fff; padding: 15px 30px; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="frame">
    <h1>最終挑戰</h1>
    <div id="intro">
        <p style="color:red;">🤕 秋天體力剩餘 20% (左手斷裂/眼鏡碎裂)</p>
        <div class="hp-box"><div class="hp-bar" id="hp"></div></div>
        <p>上一關秋天傷重，需要董娘餵食【第三顆終極能量軟糖】才能恢復體力復活！</p>
        <button class="btn-pk" onclick="heal()">🍬 餵食軟糖，恢復體力</button>
    </div>
    <div id="pk" style="display:none;">
        <div class="timer" id="t">60s</div>
        <p style="color:var(--gold);">秋天能量 100%！一分鐘 PK 連線開始！</p>
        <div class="g-b" id="board" style="display:grid;">
            <div class="tile" style="color:gold">🎤</div>
            <div class="tile" data-r="0" onclick="rot(this)"><svg width="40" height="40" viewBox="0 0 100 100"><path class="t-p" d="M 50 100 L 50 50 L 100 50"></path></svg></div>
            <div class="tile" data-r="1" onclick="rot(this)"><svg width="40" height="40" viewBox="0 0 100 100"><path class="t-p" d="M 0 50 L 100 50"></path></svg></div>
            <div class="tile" data-r="2" onclick="rot(this)"><svg width="40" height="40" viewBox="0 0 100 100"><path class="t-p" d="M 50 100 L 50 50 L 100 50"></path></svg></div>
            <div class="tile" style="color:gold">🎵</div>
            <div class="tile" data-r="3" onclick="rot(this)"><svg width="40" height="40" viewBox="0 0 100 100"><path class="t-p" d="M 50 100 L 50 50 L 100 50"></path></svg></div>
            <div class="tile" data-r="0" onclick="rot(this)"><svg width="40" height="40" viewBox="0 0 100 100"><path class="t-p" d="M 0 50 L 100 50"></path></svg></div>
            <div class="tile" data-r="1" onclick="rot(this)"><svg width="40" height="40" viewBox="0 0 100 100"><path class="t-p" d="M 50 100 L 50 50 L 100 50"></path></svg></div>
            <div class="tile" style="color:gold">👩</div>
        </div>
    </div>
</div>
<script>
    let active = false, time = 60;
    function heal() {
        alert("🍬 注入能量！秋天體力恢復 100%！左手與眼鏡已修復！");
        document.getElementById('hp').style.width = '100%';
        document.getElementById('hp').style.background = 'green';
        setTimeout(() => {
            alert("秋天復活！一分鐘 PK 戰開始，看誰快！");
            document.getElementById('intro').style.display='none';
            document.getElementById('pk').style.display='block';
            active = true;
            setInterval(() => { if(active && time > 0) { time--; document.getElementById('t').innerText=time+'s'; if(time===0) alert('時間到！'); } }, 1000);
        }, 1000);
    }
    function rot(t) { if(!active) return; let r = (parseInt(t.dataset.r)+1)%4; t.dataset.r=r; t.style.transform=`rotate(${r*90}deg)`; check(); }
    function check() { 
        const rs = Array.from(document.querySelectorAll('.tile[data-r]')).map(t=>parseInt(t.dataset.r));
        if(rs[0]===0 && rs[2]===2 && rs[4]===1) { active=false; alert("🏆 女王贏了！連線成功！母親節快樂！"); }
    }
</script>
</body>
</html>
