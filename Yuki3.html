<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最終挑戰：女王記憶殿堂</title>
    <style>
        :root { --primary: #6a0dad; --gold: #ffd700; --dark: #121212; }
        body { background-color: var(--dark); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 400px; margin-top: 20px; }
        .card { aspect-ratio: 1/1; background: var(--primary); border-radius: 8px; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; border: 1px solid #444; }
        .card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; overflow: hidden; }
        .card-back { background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--gold); }
        .card-front { background: #fff; transform: rotateY(180deg); }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }
        #win-message { display: none; text-align: center; margin-top: 30px; animation: fadeIn 1s; }
        .final-btn { background: var(--gold); color: #000; padding: 15px 30px; border-radius: 50px; font-weight: bold; border: none; font-size: 1.1rem; margin-top: 20px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <h2 style="color:var(--gold); margin-bottom:5px;">最終關：記憶殿堂</h2>
    <p style="font-size:0.9rem; color:#aaa;">配對所有機型照片，領取最終驚喜。</p>
    
    <div class="grid" id="game-grid"></div>

    <div id="win-message">
        <h2 style="color:var(--gold);">🎉 任務大成功！</h2>
        <p>所有的能量已注入完成。<br>請交付【最後一顆能量代幣】給隨從，<br>並領取您的實體驚喜！</p>
        <p style="font-size: 1.2rem; color: #fff; border-top: 1px solid #444; padding-top: 20px;">祝女王 母親節快樂！</p>
    </div>

    <script>
        const imageFiles = ['N2-138.jpg', 'N2-150.jpg', 'N2-550.jpg', 'N2-800.jpg', 'P268.jpg', 'Party7000.png', 'Star15.jpg', 'Star25.jpg'];
        let cards = [...imageFiles, ...imageFiles];
        cards.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('game-grid');
        let flippedCards = [];
        let matchedCount = 0;

        cards.forEach((img, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="card-back">?</div><div class="card-front"><img src="${img}"></div>`;
            card.dataset.name = img;
            card.onclick = () => flipCard(card);
            grid.appendChild(card);
        });

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
                card.classList.add('flipped');
                flippedCards.push(card);
                if (flippedCards.length === 2) checkMatch();
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.dataset.name === c2.dataset.name) {
                matchedCount++;
                flippedCards = [];
                if (matchedCount === imageFiles.length) {
                    setTimeout(() => {
                        grid.style.display = 'none';
                        document.getElementById('win-message').style.display = 'block';
                    }, 500);
                }
            } else {
                setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    flippedCards = [];
                }, 800);
            }
        }
    </script>
</body>
</html>
