<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女王專屬：輔助官召喚系統</title>
    <style>
        :root {
            --inyuan-purple: #6a0dad;
            --led-glow: #a855f7;
            --gold: #ffd700;
            --dark: #0f0f0f;
        }

        body { background-color: var(--dark); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }

        .phone-frame { width: 90%; max-width: 400px; border: 1px solid var(--inyuan-purple); border-radius: 30px; padding: 25px; background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); box-shadow: 0 0 30px rgba(106, 13, 173, 0.4); text-align: center; }

        .status-badge { font-size: 0.7rem; color: #00ff00; letter-spacing: 2px; margin-bottom: 10px; border: 1px solid #00ff00; display: inline-block; padding: 2px 10px; border-radius: 5px; }

        h1 { color: var(--gold); font-size: 1.6rem; margin: 10px 0; }

        .mission-card { background: rgba(106, 13, 173, 0.15); border-radius: 15px; padding: 20px; text-align: left; border: 1px solid rgba(168, 85, 247, 0.3); line-height: 1.6; }

        .choice-box { margin-top: 15px; padding: 10px; border-radius: 10px; background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold); color: var(--gold); font-size: 0.9rem; }

        .warning { color: #ff4d4d; font-size: 0.85rem; margin-top: 10px; border-top: 1px solid rgba(255, 77, 77, 0.3); padding-top: 10px; }

        .btn-play { background: linear-gradient(45deg, var(--inyuan-purple), var(--led-glow)); border: none; color: white; padding: 18px; width: 100%; border-radius: 50px; font-size: 1.1rem; font-weight: bold; margin-top: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(106, 13, 173, 0.5); }

        .footer { margin-top: 30px; font-size: 0.75rem; color: #555; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="status-badge">ONLINE / SYSTEM ACTIVE</div>
    <h1><span id="display-name">女王</span> 專屬</h1>
    
    <div class="mission-card">
        <p><strong>親愛的美麗董娘：</strong></p>
        <p>最強助手「秋天」已就位。請進行<strong>能量補幾</strong>：</p>
        
        <ul>
            <li><strong>團隊模式：</strong> 餵食助手（一次限一顆），解鎖輔助技能。</li>
        </ul>

        <div class="choice-box">
            💎 <strong>隱藏選項：</strong><br>
            如果您非常有把握，也可以選擇把糖果自己吃掉，開啟女王獨自挑戰模式！
        </div>

        <div class="warning">
            🚨 警告：嚴禁一次餵三顆，助手會因太幸福而原地登出！
        </div>
    </div>

    <audio id="audio-player"></audio>
    <button class="btn-play" onclick="startSystem()">🔊 聽取語音指令</button>

    <div class="footer">HAPPY MOTHER'S DAY 2026</div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const user = params.get('name') || 'jayyan';
    
    // 顯示名稱處理
    const displayName = user === 'jayyan' ? 'Jay Yan' : (user === 'yaling' ? '雅玲' : user);
    document.getElementById('display-name').innerText = displayName;

    const player = document.getElementById('audio-player');
    player.src = user + ".mp3";

    function startSystem() {
        const btn = document.querySelector('.btn-play');
        btn.innerText = "語音傳輸中...";
        player.play().catch(e => alert("語音檔載入失敗，請確認檔案 " + user + ".mp3 是否已上傳至 GitHub。"));
        player.onended = () => btn.innerText = "重新播放指令";
    }
</script>

</body>
</html>
