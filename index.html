<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女王專屬：終極維護系統</title>
    <style>
        :root { --purp: #6a0dad; --led: #a855f7; --gold: #ffd700; --bg: #0f0f0f; }
        body { background: var(--bg); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .frame { width: 100%; max-width: 400px; border: 1px solid var(--purp); border-radius: 30px; padding: 30px; background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); box-shadow: 0 0 30px rgba(106, 13, 173, 0.4); text-align: center; }
        .sys-st { font-size: 0.8rem; color: #888; letter-spacing: 2px; margin-bottom: 20px; border-bottom: 1px solid rgba(168, 85, 247, 0.2); padding-bottom: 15px; }
        .sys-on { color: #00ff00; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        h1 { color: #fff; font-size: 1.6rem; margin: 15px 0; }
        h1 span { color: var(--gold); }
        .intro { background: rgba(106, 13, 173, 0.1); border-radius: 15px; padding: 20px; text-align: left; line-height: 1.7; border: 1px solid rgba(168, 85, 247, 0.2); margin-bottom: 25px; }
        .tokens { color: var(--gold); font-weight: bold; font-size: 1.1rem; text-align: center; margin: 10px 0; }
        .choice-list { display: flex; flex-direction: column; gap: 15px; }
        .btn { text-decoration: none; display: block; border-radius: 50px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; padding: 18px; text-align: center; position: relative; overflow: hidden; }
        .btn-team { background: linear-gradient(45deg, var(--purp), var(--led)); color: white; border: none; box-shadow: 0 4px 15px rgba(106, 13, 173, 0.6); }
        .btn-team:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-solo { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
        .btn-solo:hover { background: rgba(255, 215, 0, 0.1); }
        .footer { margin-top: 35px; font-size: 0.75rem; color: #555; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="frame">
    <div class="sys-st">SYS STATUS: <span class="sys-on">STANDBY</span> / AUTH REQ</div>
    <h1>歡迎美麗的 <span id="vip-name">女王</span></h1>
    <div class="intro">
        親愛的董娘，母親節快樂！<br>登入「女王專屬維護系統」需檢測裝備。偵測到手中持有：
        <div class="tokens">🍬 能量代幣 x 3</div>
        請選擇您的「助手狀態」以解鎖第一關任務：
    </div>
    <div class="choice-list">
        <!-- 團隊模式按鈕：會跳出Alert叫她餵軟糖x1 -->
        <a href="#" class="btn btn-team" onclick="selectMode('team')">🛡️ 啟動夥伴：秋天 (需代幣x1)</a>
        <!-- 女王模式：直接進去 -->
        <a href="#" class="btn btn-solo" onclick="selectMode('solo')">💎 獨自挑戰：女王模式</a>
    </div>
    <div class="footer">音圓國際 專業維護 Autumn © 2026</div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const user = params.get('name') || 'JAY_YAN';
    const displayName = (user === 'JAY_YAN') ? 'Jay Yan' : (user === '雅玲' ? '雅玲' : user);
    document.getElementById('vip-name').innerText = displayName;

    function selectMode(mode) {
        const nextUrl = `Yuki1.html?name=${user}&mode=${mode}`;
        if (mode === 'team') {
            // 擬真：代幣互動
            alert(`🍬 檢測到代幣能量！\n請將【第一顆能量軟糖】餵食給助手秋天。\n\n餵食完成後，按「確定」啟動副官模式並進入第一關！`);
            window.location.href = nextUrl;
        } else {
            if (confirm(`女王英明！確定要獨享三顆軟糖，\n並獨立挑戰第一關嗎？`)) {
                window.location.href = nextUrl;
            }
        }
    }
</script>
</body>
</html>
