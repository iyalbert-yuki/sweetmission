<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一關：女王專屬指令</title>
    <style>
        :root {
            --inyuan-purple: #6a0dad;
            --led-glow: #a855f7;
            --gold: #ffd700;
            --dark: #121212;
        }

        body { background-color: var(--dark); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }

        .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .level-badge { display: inline-block; background: var(--inyuan-purple); color: white; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; border: 1px solid var(--led-glow); }
        h1 { color: var(--gold); font-size: 1.5rem; margin: 5px 0; }
        .sub-text { color: #aaa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }

        /* 語音播放按鈕 */
        .btn-voice { width: 100%; background: linear-gradient(45deg, var(--inyuan-purple), var(--led-glow)); border: none; color: white; padding: 15px; border-radius: 50px; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(106, 13, 173, 0.4); margin-bottom: 20px; }

        /* 影片播放區 (預設隱藏，聽完語音後顯示) */
        .video-container { display: none; width: 100%; max-width: 400px; border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); background: #000; margin-bottom: 20px; animation: fadeIn 1s ease-in; }
        video { width: 100%; display: block; }

        /* 猜歌詞考驗區 (預設隱藏，影片播完後顯示) */
        .quiz-container { display: none; width: 100%; max-width: 400px; background: rgba(106, 13, 173, 0.2); border: 1px solid var(--led-glow); border-radius: 15px; padding: 20px; box-sizing: border-box; text-align: center; animation: fadeIn 0.5s ease-in; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .quiz-question { font-size: 1.1rem; color: var(--gold); margin-bottom: 15px; font-weight: bold; }
        
        .btn-option { display: block; width: 100%; background: #2a2a2a; border: 1px solid #555; color: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-option:hover { background: var(--inyuan-purple); border-color: var(--led-glow); }
        .btn-option.correct { background: #00aa00; border-color: #00ff00; }
        .btn-option.wrong { background: #aa0000; border-color: #ff0000; }

        /* 過關提示區 */
        .success-message { display: none; margin-top: 15px; padding: 15px; background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; border-radius: 10px; color: #00ff00; }
        .success-message span { color: var(--gold); font-weight: bold; font-size: 1.1rem; }

        .footer { margin-top: 30px; font-size: 0.75rem; color: #555; }
    </style>
</head>
<body>

<div class="header">
    <div class="level-badge">LEVEL 1</div>
    <h1><span id="display-name">女王</span> 的專屬指令</h1>
    <div class="sub-text">系統啟動中... 請先點擊下方按鈕聽取語音指令，解鎖母親節專屬獻禮。</div>
    
    <!-- 播放 AI 語音指令 -->
    <button class="btn-voice" id="btn-voice" onclick="playVoiceCommand()">🔊 點擊聽取系統指令</button>
    <audio id="voice-player"></audio>
</div>

<!-- 影片播放區 -->
<div class="video-container" id="video-section">
    <div style="padding: 10px; text-align: center; color: var(--gold); font-size: 0.9rem;">
        這首充滿力量的女生的歌，送給偉大的您。<br>請注意聽歌詞喔！
    </div>
    <video id="mv-player" controls playsinline>
        <source src="Yuki%20girl.MP4" type="video/mp4">
        您的瀏覽器不支援影片播放。
    </video>
</div>

<!-- 猜歌詞考驗區 -->
<div class="quiz-container" id="quiz-box">
    <div class="quiz-question">🎤 記憶大考驗：請問接下來的歌詞是？</div>
    
    <!-- 請在這裡修改您的歌詞選項 -->
    <button class="btn-option" onclick="checkAnswer(this, false)">A. 填入錯誤歌詞一</button>
    <button class="btn-option" onclick="checkAnswer(this, true)">B. 填入正確歌詞 (這題會過關)</button>
    <button class="btn-option" onclick="checkAnswer(this, false)">C. 填入錯誤歌詞二</button>

    <div class="success-message" id="success-box">
        🎉 答對了！女王神機妙算！<br><br>
        請拿出您的 <span>第一顆軟糖</span><br>
        對最強助手秋天進行 <span>【能量補幾】</span><br>
        以啟動他的輔助功能！
    </div>
</div>

<div class="footer">音圓國際 代理商維護專員 秋天 敬上</div>

<script>
    // 自動抓取網址參數 (例如 ?name=jayyan)
    const params = new URLSearchParams(window.location.search);
    const user = params.get('name') || 'jayyan';
    
    // 顯示名稱替換 (只處理已知名字，保持開頭神祕)
    const displayName = user === 'jayyan' ? 'Jay Yan' : (user === 'yaling' ? '雅玲' : user);
    document.getElementById('display-name').innerText = displayName;

    // 取得語音播放器並設定對應的 MP3 (jayyan.mp3 等)
    const voicePlayer = document.getElementById('voice-player');
    voicePlayer.src = user + ".mp3";

    const btnVoice = document.getElementById('btn-voice');
    const videoSection = document.getElementById('video-section');
    const mvPlayer = document.getElementById('mv-player');
    const quizBox = document.getElementById('quiz-box');
    const successBox = document.getElementById('success-box');

    // 播放語音指令的邏輯
    function playVoiceCommand() {
        btnVoice.innerText = "語音傳輸中...";
        btnVoice.disabled = true;
        
        voicePlayer.play().catch(e => {
            alert("語音檔載入失敗，請確認 " + user + ".mp3 是否已上傳！");
            btnVoice.disabled = false;
            btnVoice.innerText = "🔊 重新聽取系統指令";
        });

        // 當語音播完時，顯示 MV 影片區塊
        voicePlayer.onended = function() {
            btnVoice.style.display = "none"; // 隱藏語音按鈕
            videoSection.style.display = "block"; // 顯示影片
            videoSection.scrollIntoView({ behavior: 'smooth' }); // 自動捲動到影片區
        };
    }

    // 當影片播放完畢時，自動顯示猜歌詞的考驗
    mvPlayer.addEventListener('ended', function() {
        quizBox.style.display = 'block';
        quizBox.scrollIntoView({ behavior: 'smooth' });
    });

    // 檢查猜歌詞答案的邏輯
    function checkAnswer(button, isCorrect) {
        const options = document.querySelectorAll('.btn-option');
        options.forEach(opt => {
            opt.classList.remove('correct', 'wrong');
            opt.disabled = true; 
        });

        if (isCorrect) {
            button.classList.add('correct');
            successBox.style.display = 'block'; 
            successBox.scrollIntoView({ behavior: 'smooth' });
        } else {
            button.classList.add('wrong');
            setTimeout(() => {
                alert("哎呀！差一點點，再想一下！");
                options.forEach(opt => opt.disabled = false); 
                button.classList.remove('wrong');
            }, 800);
        }
    }
</script>

</body>
</html>
