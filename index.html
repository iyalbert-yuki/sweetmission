<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女王專屬：維護系統啟動</title>
    <style>
        :root { --purp: #6a0dad; --led: #a855f7; --gold: #ffd700; --bg: #0f0f0f; }
        body { background: var(--bg); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .frame { width: 100%; max-width: 400px; border: 1px solid var(--purp); border-radius: 30px; padding: 30px; background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); box-shadow: 0 0 30px rgba(106, 13, 173, 0.4); text-align: center; }
        h1 span { color: var(--gold); }
        .intro { background: rgba(106, 13, 173, 0.1); border-radius: 15px; padding: 20px; text-align: left; line-height: 1.7; border: 1px solid rgba(168, 85, 247, 0.2); margin-bottom: 25px; }
        .btn-team { display: block; background: linear-gradient(45deg, var(--purp), var(--led)); color: white; border: none; padding: 18px; border-radius: 50px; font-weight: bold; cursor: pointer; text-decoration: none; box-shadow: 0 4px 15px rgba(106, 13, 173, 0.6); }
        .footer { margin-top: 30px; font-size: 0.7rem; color: #555; }
    </style>
</head>
<body>
<div class="frame">
    <h1>歡迎美麗的 <span id="vip-name">女王</span></h1>
    <div class="intro">
        最親愛的董娘，母親節快樂！<br>「女王專屬維護系統」準備就緒。<br><br>
        偵測到能量缺口，請先進行<b>能量授權</b>：
    </div>
    <a href="#" class="btn-team" onclick="startApp()">🛡️ 餵食第一顆軟糖：啟動助手</a>
    <div class="footer">音圓國際 代理商維護專員 秋天</div>
</div>
<audio id="audio" autoplay></audio>
<script>
    const ps = new URLSearchParams(window.location.search);
    const u = ps.get('name') || 'JAY_YAN';
    const aud = document.getElementById('audio');
    aud.src = (u === 'JAY_YAN') ? 'jayyan.mp3' : '雅玲.mp3';
    document.getElementById('vip-name').innerText = (u === 'JAY_YAN') ? 'Jay Yan' : (u === '雅玲' ? '雅玲' : u);

    function startApp() {
        alert("🍬 已偵測能量！\n請將【第一顆軟糖】餵食給助手秋天。\n\n餵食完成後按確定，進入第一關。");
        window.location.href = `Yuki1.html?name=${u}`;
    }
</script>
</body>
</html>
