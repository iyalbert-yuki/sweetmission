<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女王專屬：輔助官召喚系統</title>
    <style>
        :root {
            --inyuan-purple: #6a0dad;
            --led-glow: #a855f7;
            --gold: #ffd700;
            --dark: #0f0f0f;
            --success: #00ff00;
        }

        body { background-color: var(--dark); color: #fff; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }

        .phone-frame { width: 90%; max-width: 400px; border: 1px solid var(--inyuan-purple); border-radius: 30px; padding: 25px; background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); box-shadow: 0 0 30px rgba(106, 13, 173, 0.4); text-align: center; position: relative; transition: all 0.5s; }

        .status-badge { font-size: 0.7rem; color: var(--success); letter-spacing: 2px; margin-bottom: 10px; border: 1px solid var(--success); display: inline-block; padding: 2px 10px; border-radius: 5px; box-shadow: 0 0 5px var(--success); }

        h1 { color: var(--gold); font-size: 1.6rem; margin: 10px 0; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

        /* 任務文字區塊 */
        .mission-content { background: rgba(106, 13, 173, 0.15); border-radius: 15px; padding: 20px; text-align: left; border: 1px solid rgba(168, 85, 247, 0.3); line-height: 1.6; margin-bottom: 20px; min-height: 200px; }

        /* 遊戲開始特效 */
        #game-start-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); border-radius: 30px; flex-direction: column; justify-content: center; align-items: center; z-index: 10; animation: fadeIn 0.5s forwards; }

        .gs-text { font-size: 3rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px var(--gold); margin-bottom: 10px; letter-spacing: 5px; }

        .btn-play { background: linear-gradient(45deg, var(--inyuan-purple), var(--led-glow)); border: none; color: white; padding: 18px; width: 100%; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(106, 13, 173, 0.5); transition: 0.3s; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .blinking { animation: blink 1s infinite; }
    </style>
</head>
<body>

<div class="phone-frame" id="main-frame">
    <div class="status-badge" id="status">ONLINE / STANDBY</div>
    <h1><span id="display-name">女王</span> 專屬</h1>
    
    <div class="mission-content" id="text-body">
        <p><strong>親愛的美麗董娘：</strong></p>
        <p>最強助手「秋天」已就位。請點擊下方按鈕聽取指令，系統將引導您進入任務模式。</p>
        <p style="color: var(--gold); text-align: center;" class="blinking">【請開啟音量並點擊下方】</p>
    </div>

    <audio id="audio-player"></audio>
    <button class="btn-play" id="play-btn" onclick="startSystem()">🔊 啟動語音指令</button>

    <!-- 遊戲開始跳轉層 -->
    <div id="game-start-overlay">
        <div class="gs-text">GAME</div>
        <div class="gs-text">START</div>
        <p style="color: var(--success); font-weight: bold; letter-spacing: 2px;">遊戲開始</p>
        <p style="color: #888; font-size: 0.8rem; margin-top: 20px;">請餵食第一顆能量軟糖</p>
    </div>

    <div style="margin-top: 20px; font-size: 0.75rem; color: #555;">音圓國際 - 代理商維護專員 秋天</div>
</div>

<script>
    // 1. 抓取網址參數
    const params = new URLSearchParams(window.location.search);
    const user = params.get('name') || 'jayyan';
    const nameMap = {
        'jayyan': 'Jay Yan',
        'yaling': '雅玲'
    };
    const displayName = nameMap[user] || user;
    document.getElementById('display-name').innerText = displayName;

    // 2. 設定語音對白內容 (顯示用)
    const scriptText = `
        <p><strong>指令傳輸中...</strong></p>
        <p>1. 進行<b>能量補幾</b>：請對秋天餵食軟糖，一次限一顆，解鎖輔助技能。</p>
        <p>2. <b>安全警告</b>：嚴禁一次餵三顆，助手會因太幸福而原地登出！</p>
        <p>3. <b>女王模式</b>：您也可以選擇把糖果自己吃掉，獨自挑戰！</p>
    `;

    const player = document.getElementById('audio-player');
    player.src = user + ".mp3";

    function startSystem() {
        const btn = document.getElementById('play-btn');
        const status = document.getElementById('status');
        const textBody = document.getElementById('text-body');

        // 更新狀態
        status.innerText = "VOICE TRANSMITTING...";
        status.style.color = "#ffd700";
        status.style.borderColor = "#ffd700";
        btn.style.display = "none";
        
        // 顯示配音文字內容
        textBody.innerHTML = scriptText;

        // 播放語音
        player.play().catch(e => {
            alert("語音檔載入失敗，請確認檔名是否為：" + user + ".mp3");
            status.innerText = "ERROR";
        });

        // 監聽語音結束
        player.onended = function() {
            showGameStart();
        };
    }

    function showGameStart() {
        const overlay = document.getElementById('game-start-overlay');
        overlay.style.display = "flex";
        // 震動回饋 (如果手機支援)
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
        }
    }
</script>

</body>
</html>
