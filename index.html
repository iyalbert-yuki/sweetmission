<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女王專屬任務：系統啟動</title>
    <style>
        :root { --gold: #ffd700; --dark: #121212; }
        body { background-color: var(--dark); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .start-btn { padding: 20px 50px; background: linear-gradient(45deg, #ff0000, #ff7700); color: white; border: none; border-radius: 50px; font-size: 1.5rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(255,0,0,0.4); }
        #status { margin-top: 20px; color: var(--gold); font-size: 1rem; }
    </style>
</head>
<body>

    <button class="start-btn" onclick="startSystem()">🔥 啟動系統</button>
    <div id="status">等待指令中...</div>

    <audio id="intro-audio"></audio>

    <script>
        const params = new URLSearchParams(window.location.search);
        const user = params.get('name') || 'jayyan';
        const audio = document.getElementById('intro-audio');
        const status = document.getElementById('status');

        function startSystem() {
            document.querySelector('.start-btn').style.display = 'none';
            status.innerText = "系統語音傳輸中...";
            
            // 播放語音 (jayyan.mp3 或 yaling.mp3)
            audio.src = user + ".mp3";
            audio.play().catch(goToNext); // 如果音檔失敗，直接跳轉
            
            // 語音講完之後，自動帶你去第一關 yuki1.html
            audio.onended = goToNext;
        }

        function goToNext() {
            status.innerText = "正在進入第一關：ut One...";
            // 務必確認 GitHub 上的檔案名稱是 yuki1.html
            window.location.href = "yuki1.html?name=" + user;
        }
    </script>
</body>
</html>
